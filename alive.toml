schema = 1

[project]
root = "."

[dev.services.web]
command = "vite"
port = 5173
health_path = "/"
kind = "frontend"

[dev.services.api]
command = "bun run server.ts"
port = 6173
health_path = "/health"
kind = "backend"

[dev.services.api.env]
API_PORT = "6173"

[setup]
command = "bun install --no-progress"
timeout_seconds = 180

[setup.produces]
node_modules = "./node_modules"
