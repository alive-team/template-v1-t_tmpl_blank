# Declarative project config consumed by alive-workspaced.
# Schema reference: apps/workspaced/internal/config/config.go (alive-home/alive)
schema = 1

[project]
root = "."

# Multi-service supervision (epic alive-home/alive#2273, PR4 #2301).
# The daemon supervises each service as its own pid, exposes per-service
# state at /meta.services, and lets Claude restart them independently via
# /restart-service?name=<n>. No more `concurrently` hiding two processes
# behind one parent — install races and interleaved logs are gone.

[dev.services.web]
command = "vite"
port = 5173
health_path = "/"
kind = "frontend"

[dev.services.api]
command = "bun run server.ts"
port = 6173
health_path = "/health"
kind = "backend"

[dev.services.api.env]
# server.ts reads API_PORT to pick its bind port. Without this, it would
# fall back to PORT (5173) and collide with vite.
API_PORT = "6173"

[setup]
# Run by alive-workspaced before any dev service starts. Runs unconditionally
# on every daemon boot — `bun install` is idempotent (~200ms no-op on a
# populated lockfile). The legacy `gate_on` hash gate was deleted in
# alive-home/alive#2273 PR1.
command = "bun install --no-progress"
timeout_seconds = 180

[setup.produces]
# Declarative output: the daemon stat()s these after setup completes and
# reports presence via /meta. Consumed by Phase 3 (PR5 alive-home/alive#2278);
# silently ignored by the current daemon (unknown keys are forward-compatible).
node_modules = "./node_modules"
