name: Verify template
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        # Keep the deployed sandbox runtime covered until its image upgrades.
        bun: ["1.2.12", "1.3.11"]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile --no-progress
      - run: bun run check
      - run: bun run type-check
      - run: bun run test
      - run: bun run check:runtime
      - run: bun run build
